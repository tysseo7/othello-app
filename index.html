<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Othello</title>
    <link rel="stylesheet" href="index.css">
    <!-- Pi Network SDK -->
    <!--
    <script src="https://minepi.com"></script>
    -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
    <div id="auth-container">
        <h2>Othello Online - Authentication</h2>
        <p id="auth-status">Checking Pi Network authentication...</p>
        
        <!-- 通常ブラウザのときはPi Browserへジャンプ、Pi Browser内なら通常の手動認証として動かします -->
        <!-- <button id="btn-pi-login" onclick="redirectToPiBrowser()">Sign in with Pi Network</button>-->
        <button id="piLoginBtn" class="btn btn-purple">Sign in with Pi Network</button>
        <button id="btn-guest-login" onclick="loginAsGuest()">Play as Guest</button>
    </div>

    <div id="game-container" style="display: none;">
        <header>
            <h1>Othello</h1>
            <div id="user-info">
                Playing as: <span id="display-username">Guest</span>
            </div>
        </header>

        <main>
            <div id="scoreboard">
                <div class="score-box black">
                    <span class="player-name">Player (Black)</span>
                    <span id="score-black" class="score-val">2</span>
                </div>
                <div class="score-box white">
                    <span class="player-name">CPU (White)</span>
                    <span id="score-white" class="score-val">2</span>
                </div>
            </div>

            <div id="message-panel">
                <p id="game-message">Your turn (Black)</p>
            </div>

            <div id="board"></div>

            <div id="controls">
                <button id="btn-restart">Restart Game</button>
            </div>

            <!-- ランキングセクション -->
            <section id="leaderboard-section">
                <h3>🔥 世界対戦回数ランキング (Top 10)</h3>
                <table id="leaderboard-table">
                    <thead>
                        <tr>
                            <th>順位</th>
                            <th>ユーザー名</th>
                            <th>対戦回数</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <!-- データがここに動的に挿入されます -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <!-- ゲームロジックを読み込み -->
    <script src="app.js"></script>
</body>
</html>
